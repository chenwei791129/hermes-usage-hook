name: release-please

# This branch is the 0.4.x maintenance line, cut from v0.4.0 so a patch can
# ship while main carries unreleased features. It only reacts to pushes on
# itself; main keeps its own copy of this workflow targeting main.
on:
  push:
    branches:
      - release-0.4

permissions:
  contents: write
  pull-requests: write

# Serialize runs so rapid back-to-back merges don't run release-please
# concurrently. cancel-in-progress stays false: the release job (tag + GitHub
# Release creation on PR merge) is multi-step and must never be interrupted
# mid-flight, so superseded runs queue rather than cancel.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # config-file / manifest-file omitted: the files use release-please's
      # default names (release-please-config.json, .release-please-manifest.json).
      #
      # target-branch pins release-please to this branch, so it versions off
      # this branch's manifest (0.4.0) and only sees commits landed here --
      # main's unreleased features never enter this line's version bump.
      - uses: googleapis/release-please-action@v5
        with:
          target-branch: release-0.4
