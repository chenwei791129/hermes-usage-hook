name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# Serialize runs so rapid back-to-back merges don't run release-please
# concurrently. cancel-in-progress stays false: the release job (tag + GitHub
# Release creation on PR merge) is multi-step and must never be interrupted
# mid-flight, so superseded runs queue rather than cancel.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Shared workflow: the pinned release-please SHA is maintained in
  # chenwei791129/.github for every repository. release-type is omitted so the
  # repository's release-please-config.json / .release-please-manifest.json
  # (default names) are used.
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: chenwei791129/.github/.github/workflows/release-please.yml@main
